name: Deploy To Tencent

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stem-telebot-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/stem-telebot
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            . .venv/bin/activate
            pip install -r requirements.txt
            sudo -n /usr/bin/systemctl restart stem-telebot
            sudo -n /usr/bin/systemctl is-active --quiet stem-telebot
